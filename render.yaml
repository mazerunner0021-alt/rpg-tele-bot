services:
  - type: web
    name: rpg-tele-bot
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      # NOT generateValue: true — Render's generator can include characters
      # (+ / =) that Telegram's setWebhook secret_token rejects (it only
      # allows A-Z a-z 0-9 _ -). Provide a hex value instead, e.g. from:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: 10000
      # RENDER_EXTERNAL_URL is injected automatically by Render for every web
      # service — it does not need to be (and should not be) set here.
